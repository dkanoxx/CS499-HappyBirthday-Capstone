<div class="card mb-3">
  <div class="card-body">
    @if (message) { <div class="alert alert-success" role="status">{{ message }}</div> }
    @if (errorMessage) { <div class="alert alert-danger" role="alert">{{ errorMessage }}</div> }

    @if (!editing) {
      <h3>{{ trip.name }}</h3>
      <p><strong>Code:</strong> {{ trip.code }}</p>
      <p><strong>Length:</strong> {{ trip.length }}</p>
      <p><strong>Start:</strong> {{ trip.start }}</p>
      <p><strong>Resort:</strong> {{ trip.resort }}</p>
      <p><strong>Price:</strong> {{ trip.perPerson }}</p>
      <p>{{ trip.description }}</p>

      <button class="btn btn-secondary me-2" type="button" (click)="startEdit()">Edit</button>
      <button class="btn btn-danger" type="button" (click)="deleteTrip()">Delete</button>
    }

    @if (editing) {
      <h3>Edit Trip</h3>

      <input class="form-control mb-2" name="editCode" [(ngModel)]="editTrip.code" placeholder="Code">
      <input class="form-control mb-2" name="editName" [(ngModel)]="editTrip.name" placeholder="Name">
      <input class="form-control mb-2" name="editLength" [(ngModel)]="editTrip.length" placeholder="Length">
      <input class="form-control mb-2" name="editStart" [(ngModel)]="editTrip.start" placeholder="Start Date">
      <input class="form-control mb-2" name="editResort" [(ngModel)]="editTrip.resort" placeholder="Resort">
      <input class="form-control mb-2" name="editPerPerson" [(ngModel)]="editTrip.perPerson" placeholder="Per Person">
      <input class="form-control mb-2" name="editImage" [(ngModel)]="editTrip.image" placeholder="Image">
      <textarea class="form-control mb-2" name="editDescription" [(ngModel)]="editTrip.description" placeholder="Description"></textarea>

      <button class="btn btn-primary me-2" type="button" (click)="save()">Save</button>
      <button class="btn btn-outline-secondary" type="button" (click)="cancelEdit()">Cancel</button>
    }

  </div>
</div>
